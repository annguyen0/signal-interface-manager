<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Workspace Signal-Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Signal-Interface</h1>
        
        <div class="workspace-selector">
            <div class="workspace-header">
                <label for="workspace"><i class="fas fa-folder-open"></i> Chọn Workspace:</label>
                <button class="create-workspace-btn" onclick="showCreateWorkspaceModal()">
                    Tạo Workspace Mới
                </button>
            </div>
            <select id="workspace">
                <option value="">-- Chọn Workspace --</option>
                <option value="workspace1">Workspace 1</option>
                <option value="workspace2">Workspace 2</option>
                <option value="workspace3">Workspace 3</option>
            </select>
        </div>
        
        <div id="workspace-content" style="display: none;">
            <div class="filter-options">
                <div class="filter-group">
                    <label for="baseline-filter"><i class="fas fa-filter"></i> Lọc theo Baseline:</label>
                    <select id="baseline-filter">
                        <option value="">-- Tất cả Baseline --</option>
                    </select>
                </div>
                
                <button class="reset-filter" onclick="resetFilter()">
                    Đặt lại bộ lọc
                </button>
            </div>
            
            <table id="signal-interface-table">
                <thead>
                    <tr>
                        <th width="15%"><i class="fas fa-broadcast-tower"></i> Signal</th>
                        <th width="15%"><i class="fas fa-plug"></i> Interface</th>
                        <th width="10%"><i class="fas fa-layer-group"></i> Baseline</th>
                        <th width="30%"><i class="fas fa-code"></i> Logic Conversion</th>
                        <th width="15%"><i class="fas fa-clock"></i> Thời gian cập nhật</th>
                        <th width="10%"><i class="fas fa-cogs"></i> Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be added here -->
                </tbody>
            </table>
            
            <div class="button-group">
                <button class="add-row" onclick="addNewRow()">Thêm dòng mới</button>
                <button class="save-btn" onclick="saveData()">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- Modal để tạo workspace mới -->
    <div id="createWorkspaceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCreateWorkspaceModal()">&times;</span>
            <h2><i class="fas fa-folder-plus"></i> Tạo Workspace Mới</h2>
            <form id="workspace-form" onsubmit="event.preventDefault(); createNewWorkspace();">
                <div class="form-group">
                    <label for="new-workspace-name">Tên Workspace:</label>
                    <input type="text" id="new-workspace-name" placeholder="Nhập tên workspace mới..." required>
                    <p class="error-message" id="workspace-error"></p>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeCreateWorkspaceModal()">Hủy</button>
                    <button type="submit" class="confirm-btn">Tạo</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
